name: ChatB2K Ecosystem Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatb2k-ecosystem-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gemini-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify required ecosystem instructions
        run: |
          test -s GEMINI.md
          echo "GEMINI.md exists and is non-empty."
          test -f package.json
          echo "package.json exists."

      - name: Run Gemini CLI read-only audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Missing repository secret GEMINI_API_KEY. Add it in GitHub Actions secrets before enabling the Gemini audit."
            exit 1
          fi
          npx --yes @google/gemini-cli --output-format json -p "Read GEMINI.md and inspect the checked-out repository. Perform a READ-ONLY audit only. Do not edit files, call external infrastructure, or claim access to Supabase, GitHub settings, Vercel, Cloudflare, Neon, Make.com, or n8n unless evidence is present in the repository. Return JSON with: checked_files, configuration_findings, missing_evidence, risks, and next_actions. Explicitly state that repository inspection is not proof of live infrastructure synchronization." | tee gemini-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatb2k-ecosystem-audit
          path: gemini-audit.json
          if-no-files-found: ignore
          retention-days: 14
