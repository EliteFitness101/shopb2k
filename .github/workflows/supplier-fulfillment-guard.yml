name: Supplier fulfillment guard smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/supplier-fulfillment-physical-only]
permissions:
  contents: read
concurrency:
  group: supplier-fulfillment-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate supplier mode guard
        run: node scripts/smoke-supplier-fulfillment-guard.mjs
