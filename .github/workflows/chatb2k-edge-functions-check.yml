name: ChatB2K Edge Function type checks
# Uses each mirrored function's Deno config for repeatable PR-only validation.

on:
  pull_request:
    paths:
      - "supabase/functions/chatb2k-orchestrator/**"
      - "supabase/functions/chatb2k-ecosystem-tool-gateway/**"
      - "supabase/functions/flow-generation-gate/**"
      - "supabase/functions/digital-product-delivery-worker/**"
      - "supabase/functions/digital-product-media-generator/**"
      - "supabase/functions/chatb2k-publishing-router/**"
      - "supabase/functions/bigo-live-pipeline/**"
      - "supabase/functions/drive-asset-archiver/**"
      - "supabase/functions/chatb2k-professional-authority-sync/**"
      - "supabase/functions/resofit-story-generator/**"
      - "supabase/functions/resofit-story-autopilot/**"
      - "supabase/functions/social-publisher/**"
      - "supabase/functions/digital-product-media-generator-free/**"
      - "supabase/functions/digital-product-media-factory/**"
      - "supabase/functions/bigo-now-publish/**"
      - "supabase/functions/martial-content-enricher/**"
      - "supabase/functions/content-queue-ingest/**"
      - "supabase/functions/youtube-growth-engine/**"
      - "supabase/functions/chatb2k-sourcing-engine/**"
      - "supabase/functions/chatb2k-membership-autopilot/**"
      - "supabase/functions/chatb2k-agent-router/**"
      - "supabase/functions/content-asset-ingestion/**"
      - "supabase/functions/content-intelligence-enricher/**"
      - "supabase/functions/buffer-publisher/**"
      - "supabase/functions/resofit-ecosystem-autopilot/**"
      - ".github/workflows/chatb2k-edge-functions-check.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check ChatB2K orchestrator
        run: deno check --config supabase/functions/chatb2k-orchestrator/deno.json supabase/functions/chatb2k-orchestrator/index.ts
      - name: Type-check ecosystem tool gateway
        run: deno check --config supabase/functions/chatb2k-ecosystem-tool-gateway/deno.json supabase/functions/chatb2k-ecosystem-tool-gateway/index.ts
      - name: Type-check Flow generation gate
        run: deno check --config supabase/functions/flow-generation-gate/deno.json supabase/functions/flow-generation-gate/index.ts
      - name: Type-check digital delivery worker
        run: deno check --config supabase/functions/digital-product-delivery-worker/deno.json supabase/functions/digital-product-delivery-worker/index.ts
      - name: Type-check resofit-ecosystem-autopilot
        run: deno check --config supabase/functions/resofit-ecosystem-autopilot/deno.json supabase/functions/resofit-ecosystem-autopilot/index.ts
      - name: Type-check buffer-publisher
        run: deno check --config supabase/functions/buffer-publisher/deno.json supabase/functions/buffer-publisher/index.ts
      - name: Type-check content-intelligence-enricher
        run: deno check --config supabase/functions/content-intelligence-enricher/deno.json supabase/functions/content-intelligence-enricher/index.ts
      - name: Type-check content-asset-ingestion
        run: deno check --config supabase/functions/content-asset-ingestion/deno.json supabase/functions/content-asset-ingestion/index.ts
      - name: Type-check chatb2k-agent-router
        run: deno check --config supabase/functions/chatb2k-agent-router/deno.json supabase/functions/chatb2k-agent-router/index.ts
      - name: Type-check chatb2k-membership-autopilot
        run: deno check --config supabase/functions/chatb2k-membership-autopilot/deno.json supabase/functions/chatb2k-membership-autopilot/index.ts
      - name: Type-check chatb2k-sourcing-engine
        run: deno check --config supabase/functions/chatb2k-sourcing-engine/deno.json supabase/functions/chatb2k-sourcing-engine/index.ts
      - name: Type-check youtube-growth-engine
        run: deno check --config supabase/functions/youtube-growth-engine/deno.json supabase/functions/youtube-growth-engine/index.ts
      - name: Type-check digital-product-media-generator
        run: deno check --config supabase/functions/digital-product-media-generator/deno.json supabase/functions/digital-product-media-generator/index.ts
      - name: Type-check content-queue-ingest
        run: deno check --config supabase/functions/content-queue-ingest/deno.json supabase/functions/content-queue-ingest/index.ts
      - name: Type-check martial-content-enricher
        run: deno check --config supabase/functions/martial-content-enricher/deno.json supabase/functions/martial-content-enricher/index.ts
      - name: Type-check bigo-now-publish
        run: deno check --config supabase/functions/bigo-now-publish/deno.json supabase/functions/bigo-now-publish/index.ts
      - name: Type-check digital-product-media-factory
        run: deno check --config supabase/functions/digital-product-media-factory/deno.json supabase/functions/digital-product-media-factory/index.ts
      - name: Type-check digital-product-media-generator-free
        run: deno check --config supabase/functions/digital-product-media-generator-free/deno.json supabase/functions/digital-product-media-generator-free/index.ts
      - name: Type-check social-publisher
        run: deno check --config supabase/functions/social-publisher/deno.json supabase/functions/social-publisher/index.ts
      - name: Type-check resofit-story-autopilot
        run: deno check --config supabase/functions/resofit-story-autopilot/deno.json supabase/functions/resofit-story-autopilot/index.ts
      - name: Type-check chatb2k-publishing-router
        run: deno check --config supabase/functions/chatb2k-publishing-router/deno.json supabase/functions/chatb2k-publishing-router/index.ts
      - name: Type-check resofit-story-generator
        run: deno check --config supabase/functions/resofit-story-generator/deno.json supabase/functions/resofit-story-generator/index.ts
      - name: Type-check chatb2k-professional-authority-sync
        run: deno check --config supabase/functions/chatb2k-professional-authority-sync/deno.json supabase/functions/chatb2k-professional-authority-sync/index.ts
      - name: Type-check drive-asset-archiver
        run: deno check --config supabase/functions/drive-asset-archiver/deno.json supabase/functions/drive-asset-archiver/index.ts
      - name: Type-check bigo-live-pipeline
        run: deno check --config supabase/functions/bigo-live-pipeline/deno.json supabase/functions/bigo-live-pipeline/index.ts
