name: Deploy reso-web production
# Production deployment gate: build before Vercel promotion.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Production build gate
        run: npm run build
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
