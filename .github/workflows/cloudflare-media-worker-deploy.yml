name: Cloudflare R2 Media Worker Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/server.ts"
      - "src/r2-media-worker.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-media-worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-media-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shopb2k media routes to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and reconcile stale lock metadata
        run: npm install --no-audit --no-fund

      - name: Resolve the account that owns resofit.fit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          echo "Using configured Cloudflare account ID for resofit.fit: $CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Diagnose Worker script visibility without blocking deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/worker-scripts.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts?per_page=100")"
          if [ "$code" = "200" ] && jq -e '.success == true' /tmp/worker-scripts.json >/dev/null; then
            echo "Worker scripts visible to token:"
            jq -r '.result[]?.id' /tmp/worker-scripts.json
          else
            echo "::warning::Worker script listing returned HTTP $code; proceeding to the authoritative Wrangler deploy permission check."
            jq -r '.errors[]?.message // empty' /tmp/worker-scripts.json || true
          fi

      - name: Verify Cloudflare identity and deploy Worker routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler whoami
          npx wrangler deploy --config wrangler.jsonc --name shopb2k

      - name: Configure Worker R2 write secret
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_WRITE_TOKEN:-}" || { echo "::error::Missing R2_WRITE_TOKEN repository secret"; exit 1; }
          printf '%s' "$R2_WRITE_TOKEN" | npx wrangler secret put R2_WRITE_TOKEN --config wrangler.jsonc --name shopb2k

      - name: Verify deployed Worker service and routes
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/worker-service-response.txt -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/shopb2k")"
          content_type="$(file -b --mime-type /tmp/worker-service-response.txt 2>/dev/null || echo unknown)"
          echo "Worker service API HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare Worker service verification returned HTTP $code."
            sed -n '1,12p' /tmp/worker-service-response.txt
            exit 1
          fi
          if ! jq -e '.success == true' /tmp/worker-service-response.txt >/dev/null 2>&1; then
            echo "::error::Cloudflare Worker service endpoint did not return the expected success JSON (detected MIME: $content_type)."
            sed -n '1,12p' /tmp/worker-service-response.txt
            exit 1
          fi
          echo "Cloudflare confirms Worker service shopb2k exists in the resolved account."
