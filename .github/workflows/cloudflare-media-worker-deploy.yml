name: Cloudflare R2 Media Worker Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/server.ts"
      - "src/r2-media-worker.ts"
      - "wrangler.jsonc"
      - "wrangler.upload.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-media-worker-deploy.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-media-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shopb2k media routes to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and reconcile stale lock metadata
        run: npm install --no-audit --no-fund

      - name: Resolve the account that owns resofit.fit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          echo "Using configured Cloudflare account ID for resofit.fit: $CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Diagnose Worker script visibility without blocking deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/worker-scripts.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts?per_page=100")"
          if [ "$code" = "200" ] && jq -e '.success == true' /tmp/worker-scripts.json >/dev/null; then
            echo "Worker scripts visible to token:"
            jq -r '.result[]?.id' /tmp/worker-scripts.json
          else
            echo "::warning::Worker script listing returned HTTP $code; proceeding to the authoritative Wrangler deploy permission check."
            jq -r '.errors[]?.message // empty' /tmp/worker-scripts.json || true
          fi

      - name: Resolve isolated workers.dev test hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/workers-subdomain.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          test "$code" = "200" || { echo "::error::Unable to resolve the account workers.dev subdomain (HTTP $code). No production route will be changed."; exit 1; }
          subdomain="$(jq -r '.result.subdomain // empty' /tmp/workers-subdomain.json)"
          test -n "$subdomain" || { echo "::error::No workers.dev subdomain is registered for this Cloudflare account."; exit 1; }
          echo "CLOUDFLARE_WORKERS_SUBDOMAIN=$subdomain" >> "$GITHUB_ENV"
          echo "Isolated test hostname: test-upload-format.$subdomain.workers.dev"

      - name: Confirm existing Worker write-token secret
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_WRITE_TOKEN:-}" || { echo "::error::Missing R2_WRITE_TOKEN repository secret"; exit 1; }
          printf '%s' "$R2_WRITE_TOKEN" | npx wrangler secret put R2_WRITE_TOKEN --config wrangler.jsonc --name test-upload-format

      - name: Verify Cloudflare identity and deploy Worker script only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler whoami
          jq '.workers_dev = true | del(.routes, ."$schema")' wrangler.jsonc > .wrangler-worker-only.jsonc
          trap 'rm -f .wrangler-worker-only.jsonc' EXIT
          npx wrangler deploy --config .wrangler-worker-only.jsonc --name test-upload-format

      - name: Verify isolated R2 Worker upload, ranged download, and cleanup
        if: success()
        env:
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ env.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          test -n "${R2_WRITE_TOKEN:-}" || { echo "::error::Missing R2_WRITE_TOKEN repository secret"; exit 1; }
          test -n "${CLOUDFLARE_WORKERS_SUBDOMAIN:-}" || { echo "::error::Missing isolated workers.dev subdomain"; exit 1; }
          BASE_URL="https://test-upload-format.$CLOUDFLARE_WORKERS_SUBDOMAIN.workers.dev"
          KEY="elite/smoke/$GITHUB_RUN_ID.txt"
          URL="$BASE_URL/$KEY"
          PAYLOAD="ResoFit R2 probe $GITHUB_RUN_ID"
          HEALTH_CODE="$(curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --output /tmp/r2-health.json --write-out '%{http_code}' "$BASE_URL/health")"
          test "$HEALTH_CODE" = "200" || { cat /tmp/r2-health.json; echo "::error::Isolated R2 health failed: HTTP $HEALTH_CODE"; exit 1; }
          jq -e '.ok == true and .bucket_binding_ready == true' /tmp/r2-health.json >/dev/null
          UPLOAD_CODE="$(printf '%s' "$PAYLOAD" | curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --request PUT --header "Authorization: Bearer $R2_WRITE_TOKEN" --header 'Content-Type: text/plain' --data-binary @- --output /tmp/r2-upload.json --write-out '%{http_code}' "$URL")"
          test "$UPLOAD_CODE" = "200" || { cat /tmp/r2-upload.json; echo "::error::Isolated R2 upload failed: HTTP $UPLOAD_CODE"; exit 1; }
          jq -e '.ok == true' /tmp/r2-upload.json >/dev/null
          RANGE_CODE="$(curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --header 'Range: bytes=0-5' --output /tmp/r2-range.txt --write-out '%{http_code}' "$URL")"
          test "$RANGE_CODE" = "206" || { echo "::error::Isolated R2 range read failed: HTTP $RANGE_CODE"; exit 1; }
          test "$(cat /tmp/r2-range.txt)" = "${PAYLOAD:0:6}" || { echo "::error::Isolated R2 range bytes mismatch"; exit 1; }
          DELETE_CODE="$(curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --request DELETE --header "Authorization: Bearer $R2_WRITE_TOKEN" --output /tmp/r2-delete.json --write-out '%{http_code}' "$URL")"
          test "$DELETE_CODE" = "200" || { cat /tmp/r2-delete.json; echo "::error::Isolated R2 cleanup failed: HTTP $DELETE_CODE"; exit 1; }
          MISSING_CODE="$(curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --output /dev/null --write-out '%{http_code}' "$URL")"
          test "$MISSING_CODE" = "404" || { echo "::error::Isolated R2 object remains after cleanup: HTTP $MISSING_CODE"; exit 1; }
          echo "PASS: isolated R2 Worker PUT, range GET, DELETE and missing-object read-back verified."

      - name: Deploy dedicated production upload gateway
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_WRITE_TOKEN:-}" || { echo "::error::Missing R2_WRITE_TOKEN repository secret"; exit 1; }
          printf '%s' "$R2_WRITE_TOKEN" | npx wrangler secret put R2_WRITE_TOKEN --config wrangler.upload.jsonc --name resofit-upload-gateway
          npx wrangler deploy --config wrangler.upload.jsonc

      - name: Verify production upload gateway R2 write, CDN read-back, and cleanup
        if: success()
        env:
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_WRITE_TOKEN:-}" || { echo "::error::Missing R2_WRITE_TOKEN repository secret"; exit 1; }
          BASE_URL="https://upload.resofit.fit"
          KEY="test/smoke/$GITHUB_RUN_ID.txt"
          ENCODED_KEY="$(jq -rn --arg key "$KEY" '$key|@uri')"
          UPLOAD_URL="$BASE_URL/api/ingest-media?key=$ENCODED_KEY"
          PUBLIC_URL="https://media.resofit.fit/$KEY"
          PAYLOAD="ResoFit production R2 upload $GITHUB_RUN_ID"
          printf '%s' "$PAYLOAD" > /tmp/r2-production-payload.txt
          HEALTH_CODE="$(curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --output /tmp/r2-production-health.json --write-out '%{http_code}' "$BASE_URL/health")"
          test "$HEALTH_CODE" = "200" || { cat /tmp/r2-production-health.json; echo "::error::Production upload health failed: HTTP $HEALTH_CODE"; exit 1; }
          jq -e '.ok == true and .provider == "cloudflare_r2" and .bucket_binding_ready == true' /tmp/r2-production-health.json >/dev/null
          UPLOAD_CODE="$(curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --request POST --header "Authorization: Bearer $R2_WRITE_TOKEN" --header 'Content-Type: text/plain' --header 'Cache-Control: no-store' --data-binary @/tmp/r2-production-payload.txt --output /tmp/r2-production-upload.json --write-out '%{http_code}' "$UPLOAD_URL")"
          test "$UPLOAD_CODE" = "200" || { cat /tmp/r2-production-upload.json; echo "::error::Production R2 upload failed: HTTP $UPLOAD_CODE"; exit 1; }
          jq -e '.ok == true' /tmp/r2-production-upload.json >/dev/null
          READ_CODE="$(curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --header 'Cache-Control: no-cache' --output /tmp/r2-production-readback.txt --write-out '%{http_code}' "$PUBLIC_URL")"
          test "$READ_CODE" = "200" || { echo "::error::Production media CDN read-back failed: HTTP $READ_CODE"; exit 1; }
          cmp -s /tmp/r2-production-payload.txt /tmp/r2-production-readback.txt || { echo "::error::Production media CDN read-back bytes differ"; exit 1; }
          DELETE_CODE="$(curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --request DELETE --header "Authorization: Bearer $R2_WRITE_TOKEN" --output /tmp/r2-production-delete.json --write-out '%{http_code}' "$UPLOAD_URL")"
          test "$DELETE_CODE" = "200" || { cat /tmp/r2-production-delete.json; echo "::error::Production R2 cleanup failed: HTTP $DELETE_CODE"; exit 1; }
          MISSING_CODE="$(curl --silent --show-error --user-agent 'ResoFit-R2-Smoke/1.0' --header 'Cache-Control: no-cache' --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL")"
          test "$MISSING_CODE" = "404" || { echo "::error::Production R2 smoke object remains after cleanup: HTTP $MISSING_CODE"; exit 1; }
          echo "PASS: upload.resofit.fit -> resofit-cdn -> media.resofit.fit write/read/delete verified."

      - name: Publish live R2 verification status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Isolated and production upload gateway R2 write/read-back/cleanup passed"
          else
            STATE="failure"
            DESCRIPTION="Isolated or production Cloudflare R2 Worker deploy/round-trip failed"
          fi
          PAYLOAD="$(jq -n --arg state "$STATE" --arg context "Cloudflare R2 Production Round-trip" --arg description "$DESCRIPTION" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD"
