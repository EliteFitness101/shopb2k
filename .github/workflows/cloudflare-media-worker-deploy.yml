name: Cloudflare R2 Media Worker Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/server.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-media-worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-media-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shopb2k media routes to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Deploy Worker and configured routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --name shopb2k
