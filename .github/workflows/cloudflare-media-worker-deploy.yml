name: Cloudflare R2 Media Worker Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/server.ts"
      - "src/r2-media-worker.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-media-worker-deploy.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-media-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shopb2k media routes to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and reconcile stale lock metadata
        run: npm install --no-audit --no-fund

      - name: Resolve the account that owns resofit.fit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          echo "Using configured Cloudflare account ID for resofit.fit: $CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Diagnose Worker script visibility without blocking deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/worker-scripts.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts?per_page=100")"
          if [ "$code" = "200" ] && jq -e '.success == true' /tmp/worker-scripts.json >/dev/null; then
            echo "Worker scripts visible to token:"
            jq -r '.result[]?.id' /tmp/worker-scripts.json
          else
            echo "::warning::Worker script listing returned HTTP $code; proceeding to the authoritative Wrangler deploy permission check."
            jq -r '.errors[]?.message // empty' /tmp/worker-scripts.json || true
          fi

      - name: Confirm existing Worker write-token secret
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_WRITE_TOKEN:-}" || { echo "::error::Missing R2_WRITE_TOKEN repository secret"; exit 1; }
          printf '%s' "$R2_WRITE_TOKEN" | npx wrangler secret put R2_WRITE_TOKEN --config wrangler.jsonc --name test-upload-format

      - name: Verify Cloudflare identity and deploy Worker script only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler whoami
          jq 'del(.routes, ."$schema")' wrangler.jsonc > .wrangler-worker-only.jsonc
          trap 'rm -f .wrangler-worker-only.jsonc' EXIT
          npx wrangler deploy --config .wrangler-worker-only.jsonc --name test-upload-format

      - name: Verify real production upload, ranged download, and cleanup in Chromium
        if: success()
        env:
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_WRITE_TOKEN:-}" || { echo "::error::Missing R2_WRITE_TOKEN repository secret"; exit 1; }
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const token = process.env.R2_WRITE_TOKEN;
            const runId = process.env.GITHUB_RUN_ID;
            const key = `chatb2k/r2-production-probe-${runId}.mp4`;
            const payload = `ResoFit R2 probe ${runId}`;
            const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            let uploaded = false;
            let failure;

            try {
              const navigation = await page.goto("https://media.resofit.fit/", {
                waitUntil: "domcontentloaded",
                timeout: 90000,
              });
              console.log("Media-origin bootstrap status:", navigation?.status() ?? "no response");
              await page.waitForFunction(
                () => !/just a moment/i.test(document.title),
                null,
                { timeout: 60000 },
              );

              const upload = await page.evaluate(async ({ token, key, payload }) => {
                const path = "/" + key.split("/").map(encodeURIComponent).join("/");
                const response = await fetch(path, {
                  method: "PUT",
                  headers: {
                    Authorization: "Bearer " + token,
                    "Content-Type": "video/mp4",
                  },
                  body: payload,
                });
                return { status: response.status, body: (await response.text()).slice(0, 800) };
              }, { token, key, payload });

              console.log("Live media-host upload status:", upload.status);
              if (upload.status !== 200) throw new Error("Live upload failed: HTTP " + upload.status + " " + upload.body);
              if (!upload.body.includes('"ok":true')) throw new Error("Upload returned an unexpected response");
              uploaded = true;

              const range = await page.evaluate(async ({ key }) => {
                const path = "/" + key.split("/").map(encodeURIComponent).join("/");
                const response = await fetch(path, { headers: { Range: "bytes=0-5" } });
                return {
                  status: response.status,
                  contentRange: response.headers.get("Content-Range"),
                  body: await response.text(),
                };
              }, { key });

              console.log("Live ranged download status:", range.status, "Content-Range:", range.contentRange);
              if (range.status !== 206) throw new Error("Range read failed: HTTP " + range.status);
              if (!/^bytes 0-5\//i.test(range.contentRange ?? "")) throw new Error("Missing/invalid Content-Range");
              if (range.body !== payload.slice(0, 6)) throw new Error("Range response bytes did not match the uploaded file");
              console.log("PASS: uploaded file read back through production R2 route with matching range bytes.");
            } catch (error) {
              failure = error;
            }

            if (uploaded) {
              try {
                const cleanup = await page.evaluate(async ({ token, key }) => {
                  const path = "/" + key.split("/").map(encodeURIComponent).join("/");
                  const response = await fetch(path, { method: "DELETE", headers: { Authorization: "Bearer " + token } });
                  return { status: response.status, body: (await response.text()).slice(0, 300) };
                }, { token, key });
                console.log("Temporary probe cleanup status:", cleanup.status);
                if (cleanup.status !== 200 && !failure) failure = new Error("Probe cleanup failed: HTTP " + cleanup.status);
              } catch (error) {
                if (!failure) failure = error;
              }
            }

            await browser.close();
            if (failure) throw failure;
          })().catch((error) => {
            console.error(error?.stack ?? String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Publish live R2 verification status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Cloudflare deployed and live R2 upload/range read-back passed"
          else
            STATE="failure"
            DESCRIPTION="Cloudflare deploy or live R2 upload/range read-back failed"
          fi
          PAYLOAD="$(jq -n --arg state "$STATE" --arg context "Cloudflare R2 Production Round-trip" --arg description "$DESCRIPTION" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD"
