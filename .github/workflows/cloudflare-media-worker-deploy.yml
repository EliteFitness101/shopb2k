name: Cloudflare R2 Media Worker Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/server.ts"
      - "src/r2-media-worker.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-media-worker-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-media-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shopb2k media routes to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and reconcile stale lock metadata
        run: npm install --no-audit --no-fund

      - name: Resolve the account that owns resofit.fit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          echo "Using configured Cloudflare account ID for resofit.fit: $CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Diagnose Worker script visibility without blocking deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/worker-scripts.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts?per_page=100")"
          if [ "$code" = "200" ] && jq -e '.success == true' /tmp/worker-scripts.json >/dev/null; then
            echo "Worker scripts visible to token:"
            jq -r '.result[]?.id' /tmp/worker-scripts.json
          else
            echo "::warning::Worker script listing returned HTTP $code; proceeding to the authoritative Wrangler deploy permission check."
            jq -r '.errors[]?.message // empty' /tmp/worker-scripts.json || true
          fi

      - name: Verify Cloudflare identity and deploy Worker script only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler whoami
          jq 'del(.routes, ."$schema")' wrangler.jsonc > .wrangler-worker-only.jsonc
          trap 'rm -f .wrangler-worker-only.jsonc' EXIT
          npx wrangler deploy --config .wrangler-worker-only.jsonc --name test-upload-format

      - name: Configure cross-account R2 runtime secrets
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_REGION: ${{ secrets.R2_REGION }}
        run: |
          set -euo pipefail
          for name in R2_WRITE_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_ENDPOINT; do
            test -n "${!name:-}" || { echo "::error::Missing required GitHub Actions secret: $name"; exit 1; }
            printf '%s' "${!name}" | npx wrangler secret put "$name" --config wrangler.jsonc --name test-upload-format
          done
          if [ -n "${R2_REGION:-}" ]; then
            printf '%s' "$R2_REGION" | npx wrangler secret put R2_REGION --config wrangler.jsonc --name test-upload-format
          fi

      - name: Verify real production upload, ranged download, and cleanup
        if: success()
        env:
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_WRITE_TOKEN:-}" || { echo "::error::Missing R2_WRITE_TOKEN repository secret"; exit 1; }
          KEY="chatb2k/r2-production-probe-${GITHUB_RUN_ID}.mp4"
          printf 'ResoFit R2 probe ${GITHUB_RUN_ID}' > /tmp/r2-probe.bin
          cleanup() {
            curl --silent --show-error --max-time 20 -o /dev/null -X DELETE \
              -H "Authorization: Bearer $R2_WRITE_TOKEN" \
              "https://media.resofit.fit/$KEY" || true
          }
          trap cleanup EXIT
          UPLOAD_STATUS="$(curl --silent --show-error --max-time 30 -o /tmp/r2-upload-response.json -w '%{http_code}' \
            -X POST --data-binary @/tmp/r2-probe.bin \
            -H "Authorization: Bearer $R2_WRITE_TOKEN" -H 'Content-Type: video/mp4' \
            "https://upload.resofit.fit/?key=$KEY")"
          echo "Live upload status: HTTP $UPLOAD_STATUS"
          test "$UPLOAD_STATUS" = "200"
          grep -q '"ok":true' /tmp/r2-upload-response.json
          RANGE_STATUS="$(curl --silent --show-error --max-time 30 -D /tmp/r2-probe-headers.txt -o /tmp/r2-probe-range.bin -w '%{http_code}' \
            -H 'Range: bytes=0-5' "https://media.resofit.fit/$KEY")"
          echo "Live ranged download status: HTTP $RANGE_STATUS"
          test "$RANGE_STATUS" = "206"
          grep -qi '^content-range: bytes 0-5/' /tmp/r2-probe-headers.txt
          cmp -n 6 /tmp/r2-probe.bin /tmp/r2-probe-range.bin
          echo "PASS: production upload, R2-backed ranged read, byte comparison, and cleanup requested."
