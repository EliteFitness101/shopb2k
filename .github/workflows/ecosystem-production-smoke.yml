name: ResoFit Ecosystem Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ecosystem-production-smoke.yml"
      - "scripts/ops/ecosystem-smoke.mjs"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ecosystem-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Read-only production endpoint and mirror checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SMOKE_TIMEOUT_MS: "15000"
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      ENABLE_FIRECRAWL: ${{ github.event_name != 'pull_request' && secrets.FIRECRAWL_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate smoke script syntax
        run: node --check scripts/ops/ecosystem-smoke.mjs
      - name: Probe production endpoints
        run: node scripts/ops/ecosystem-smoke.mjs
