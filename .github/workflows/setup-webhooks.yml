name: ResoFit Webhook Setup

# Production recovery/verification workflow: reconciles canonical Shopify webhooks for the ResoFit store.
# The store's public primary domain is shop.resofit.fit; Shopify Admin OAuth requires the store's *.myshopify.com domain.

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: "Shopify Admin API Version"
        required: true
        default: "2026-07"
        type: string
  push:
    branches:
      - main
    paths:
      - "scripts/setup-webhooks.ts"
      - ".github/workflows/setup-webhooks.yml"

jobs:
  configure-webhooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install tsx
        run: npm install --no-save tsx

      - name: Execute Webhook Upsert Script
        env:
          # Shopify client-credentials OAuth must target the canonical *.myshopify.com domain.
          SHOPIFY_STORE_DOMAIN: w7hm0i-8w.myshopify.com
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION: ${{ inputs.api_version || '2026-07' }}
        run: npx tsx scripts/setup-webhooks.ts
