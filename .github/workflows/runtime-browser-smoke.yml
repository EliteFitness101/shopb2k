name: ResoFit Vercel preview browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: resofit-vercel-preview-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Resolve the Vercel preview deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            checks="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$CHECK_SHA/check-runs?per_page=100")"
            summary="$(printf '%s' "$checks" | jq -r '.check_runs[] | select(.name == "Vercel Preview Comments" and .status == "completed" and .conclusion == "success") | .output.summary' | head -n 1)"
            preview_host="$(printf '%s' "$summary" | sed -nE 's#.*https://vercel\.live/open-feedback/([^?[:space:]]+).*#\1#p')"
            if [[ -n "$preview_host" ]]; then
              echo "BASE_URL=https://$preview_host" >> "$GITHUB_ENV"
              echo "Resolved Vercel preview: https://$preview_host"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel Preview Comments did not publish a ready preview URL for $CHECK_SHA."
          exit 1
      - name: Install Playwright
        run: bun add --no-save @playwright/test
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test the deployed Vercel preview in Chromium
        run: bunx playwright test tests/browser/runtime-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resofit-vercel-preview-browser-smoke-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
