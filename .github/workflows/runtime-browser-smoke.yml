name: ResoFit local production-bundle browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resofit-local-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-bundle-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build production bundle
        run: bun run build
      - name: Inspect generated worker asset routing (sanitized)
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=".output/server/wrangler.json"; const c=JSON.parse(fs.readFileSync(p,"utf8")); const b=Array.isArray(c.bindings)?c.bindings.map(x=>({name:x.name,type:x.type})):[]; console.log(JSON.stringify({config:p,main:c.main,assets:c.assets,bindings:b,publicRootExists:fs.existsSync(".output/public"),publicRootEntries:fs.existsSync(".output/public")?fs.readdirSync(".output/public").slice(0,12):[]},null,2));'
      - name: Install Playwright
        run: bun add --no-save @playwright/test
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test built app in Chromium
        env:
          DEBUG: pw:webserver
        run: bunx playwright test tests/browser/runtime-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resofit-local-browser-smoke-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7