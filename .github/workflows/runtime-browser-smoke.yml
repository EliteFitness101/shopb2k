name: ResoFit local production-bundle browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resofit-local-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-bundle-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build production bundle
        run: bun run build
      - name: Start built Cloudflare worker and verify route readiness
        run: |
          cat .output/server/wrangler.json
          cd .output/server
          bunx wrangler dev --local --config wrangler.json --ip 127.0.0.1 --port 4173 --log-level debug > /tmp/resofit-wrangler.log 2>&1 &
          echo $! > /tmp/resofit-wrangler.pid
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:4173/ || true)"
            if [[ "$status" =~ ^[23][0-9][0-9]$ ]]; then
              echo "Built worker is serving HTTP $status."
              exit 0
            fi
            if [[ "$status" != "000" ]]; then
              echo "Built worker returned unexpected HTTP $status for /."
              cat /tmp/resofit-wrangler.log
              exit 1
            fi
            if ! kill -0 "$(cat /tmp/resofit-wrangler.pid)" 2>/dev/null; then
              cat /tmp/resofit-wrangler.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/resofit-wrangler.log
          exit 1
      - name: Install Playwright
        run: bun add --no-save @playwright/test
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test built app in Chromium
        run: bunx playwright test tests/browser/runtime-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resofit-local-browser-smoke-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7