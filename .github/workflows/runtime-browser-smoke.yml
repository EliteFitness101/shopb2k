name: ResoFit local production-bundle browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resofit-local-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-bundle-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test built app in Chromium
        run: npx playwright test tests/browser/runtime-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resofit-local-browser-smoke-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7