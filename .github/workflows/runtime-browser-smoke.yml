name: ResoFit Vercel preview browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
concurrency:
  group: resofit-vercel-preview-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Resolve the Vercel preview deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            deployments="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments?sha=$CHECK_SHA&environment=Preview&per_page=100")"
            for deployment_id in $(printf '%s' "$deployments" | jq -r '.[].id'); do
              statuses="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=10")"
              preview_url="$(printf '%s' "$statuses" | jq -r '[.[] | select(.state == "success") | (.environment_url // .target_url) | select(type == "string" and startswith("https://reso-") and contains("resonancefitnessng-2206.vercel.app"))] | .[0] // empty')"
              if [[ -n "$preview_url" ]]; then
                echo "BASE_URL=$preview_url" >> "$GITHUB_ENV"
                echo "Resolved deployed Vercel preview: $preview_url"
                exit 0
              fi
            done
            sleep 10
          done
          echo "No successful reso-web Vercel Preview deployment was published for $CHECK_SHA."
          exit 1
      - name: Install Playwright
        run: bun add --no-save @playwright/test
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test the deployed Vercel preview in Chromium
        run: bunx playwright test tests/browser/runtime-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resofit-vercel-preview-browser-smoke-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
