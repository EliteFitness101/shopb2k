name: Deploy ResoFit media Worker

on:
  push:
    branches: [main]
    paths:
      - "wrangler.jsonc"
      - "src/**"
      - "vite.config.ts"
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/deploy-media-worker.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resofit-media-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Build TanStack Start with the configured Vite/Cloudflare integration
        run: npm run build

      - name: Sync existing R2 write token to the production app Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SHOPB2K_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_WRITE_TOKEN: ${{ secrets.R2_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${R2_WRITE_TOKEN:-}" || { echo "::error::Missing R2_WRITE_TOKEN repository secret"; exit 1; }
          printf '%s' "$R2_WRITE_TOKEN" | npx --yes wrangler@4 secret put R2_WRITE_TOKEN --name shopb2k

      - name: Deploy generated Worker configuration and media hostname route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          # Keep the generated TanStack/Vite bundle and aliases, but do not
          # steal media/content/upload routes owned by the dedicated R2 Worker.
          node <<'NODE'
          const fs = require("fs");
          const source = ".wrangler/deploy/config.json";
          const target = ".wrangler/deploy/config-no-routes.json";
          const config = JSON.parse(fs.readFileSync(source, "utf8"));
          delete config.routes;
          delete config.route;
          config.name = "shopb2k";
          fs.writeFileSync(target, JSON.stringify(config, null, 2));
          console.log("Prepared shopb2k app Worker config without media route takeover.");
          NODE
          npx --yes wrangler@4 deploy --config .wrangler/deploy/config-no-routes.json --name shopb2k
