name: Deploy ResoFit R2 Media Router

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm deployment to media.resofit.fit after Cloudflare bucket/domain setup is verified"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: resofit-media-router-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Wrangler configuration and bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler/deploy-check --config cloudflare/media-router/wrangler.jsonc

  deploy:
    name: Deploy production Worker
    if: ${{ inputs.confirm_production_deploy == true }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository/environment secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository/environment secret"; exit 1; }
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/media-router/wrangler.jsonc
