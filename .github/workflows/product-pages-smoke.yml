name: ResoFit 66 Product Page Smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/product-pages.json"
      - "scripts/smoke-product-pages.mjs"
      - ".github/workflows/product-pages-smoke.yml"
  workflow_dispatch:

jobs:
  smoke-product-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test all canonical product pages
        run: node scripts/smoke-product-pages.mjs
